[phases.setup]
nixPkgs = ["tesseract", "poppler"]
aptPkgs = ["tesseract-ocr", "poppler-utils"]
paths = ["/nix/var/nix/profiles/default/bin", "/usr/bin"]

[phases.build]
cmds = ["tesseract --version"]

[variables]
TESSERACT_CMD = "/usr/bin/tesseract"

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT app:app"
